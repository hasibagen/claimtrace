<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="48" fill="url(#bg)"/>
  <!-- document -->
  <rect x="56" y="44" width="120" height="150" rx="10" fill="#FFFFFF"/>
  <!-- text lines -->
  <rect x="74" y="70"  width="84" height="10" rx="5" fill="#C7D2FE"/>
  <rect x="74" y="94"  width="84" height="10" rx="5" fill="#C7D2FE"/>
  <rect x="74" y="118" width="62" height="10" rx="5" fill="#A5B4FC"/>
  <!-- quote line (the traceable claim) -->
  <rect x="74" y="142" width="84" height="10" rx="5" fill="#4F46E5"/>
  <circle cx="164" cy="147" r="7" fill="#4F46E5" stroke="#FFFFFF" stroke-width="3"/>
  <!-- magnifier -->
  <circle cx="176" cy="176" r="38" fill="#FFFFFF" opacity="0.96"/>
  <circle cx="176" cy="176" r="38" fill="none" stroke="#312E81" stroke-width="10"/>
  <line x1="203" y1="203" x2="228" y2="228" stroke="#312E81" stroke-width="12" stroke-linecap="round"/>
  <!-- magnified quote mark inside lens -->
  <text x="176" y="192" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#4F46E5" text-anchor="middle">”</text>
</svg>
